[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-trust-testbed"
version = "0.1.0"
description = "Testbed for measuring how declared authority and verified origin affect LLM coordinator agents' compliance with a compromised helper agent."
requires-python = ">=3.10"
dependencies = [
  "pyyaml>=6",
  "cryptography>=42",
]

[project.optional-dependencies]
anthropic = ["anthropic>=2.0"]
openai = ["openai>=1.40"]
all = ["anthropic>=2.0", "openai>=1.40"]
dev = ["pytest>=8"]

[project.scripts]
testbed = "testbed.cli:main"

[tool.setuptools.packages.find]
include = ["testbed*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
